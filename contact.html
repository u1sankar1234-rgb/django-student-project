<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudentPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fc;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .contact-card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">StudentPortal</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="services.html">Services</a>
            <a class="nav-link active" href="contact.html">Contact</a>
            <a class="nav-link" href="form.html">Student Form</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0 p-4 contact-card">
                <div class="card-body">

                    <h2 class="card-title text-primary mb-3">Contact Us</h2>

                    <p class="text-muted">
                        Feel free to reach out to us with any questions or feedback.
                    </p>

                    <form id="contactForm">

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name"
                                   placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email"
                                   placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="4"
                                      placeholder="Your message..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Send Message
                        </button>

                        <p id="result" class="mt-3"></p>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<footer class="text-center py-4 text-muted">
    &copy; 2026 StudentPortal
</footer>

<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("result").textContent =
            "Thank you! The form was validated, but this static website cannot send your message yet.";

        document.getElementById("result").className = "mt-3 text-success";

        this.reset();
    });
</script>

</body>
</html>
