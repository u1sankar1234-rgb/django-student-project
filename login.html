<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudentPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fc;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .login-card {
            border-radius: 15px;
        }

        .login-title {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                StudentPortal
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="services.html">Services</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="form.html">Student Form</a>
                <a class="nav-link active" href="login.html">Login</a>
            </div>

        </div>
    </nav>

    <!-- Login Form -->
    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow-sm border-0 mt-4 login-card">
                    <div class="card-body p-4">

                        <h3 class="card-title text-center login-title mb-4">
                            Login
                        </h3>

                        <div id="errorMessage"
                             class="alert alert-danger d-none"
                             role="alert">
                            Please enter your username and password.
                        </div>

                        <form id="loginForm">

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       name="username"
                                       class="form-control"
                                       id="username"
                                       placeholder="Enter your username"
                                       autocomplete="username"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Enter your password"
                                       autocomplete="current-password"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Sign In
                            </button>

                        </form>

                        <p class="text-muted text-center mt-3 mb-0">
                            StudentPortal Login
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <footer class="text-center text-muted py-4">
        &copy; 2026 StudentPortal. All rights reserved.
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("errorMessage").classList.remove("d-none");

            document.getElementById("errorMessage").textContent =
                "Login is not connected to a server. A backend is required to verify your username and password.";
        });
    </script>

</body>
</html>
