<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form - StudentPortal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fc;
        }

        .navbar {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .student-card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            StudentPortal
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="services.html">Services</a>
            <a class="nav-link" href="contact.html">Contact</a>
            <a class="nav-link active" href="form.html">Student Form</a>
        </div>
    </div>
</nav>

<!-- Student Form -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-0 p-4 student-card">
                <div class="card-body">

                    <h3 class="card-title text-primary mb-3">
                        Student Form
                    </h3>

                    <form id="studentForm">

                        <div class="mb-3">
                            <label for="student_name" class="form-label">
                                Student Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="student_name"
                                   name="name"
                                   placeholder="Enter full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="student_email" class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="student_email"
                                   name="email"
                                   placeholder="name@example.com"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="course" class="form-label">
                                Course
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="course"
                                   name="course"
                                   placeholder="e.g. Computer Science"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>

                        <p id="result" class="mt-3"></p>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<footer class="text-center text-muted py-4">
    &copy; 2026 StudentPortal
</footer>

<script>
    document.getElementById("studentForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("student_name").value.trim();

        document.getElementById("result").textContent =
            "Thank you, " + name + "! The form was completed successfully, but the information has not been saved.";

        document.getElementById("result").className = "mt-3 text-success";

        this.reset();
    });
</script>

</body>
</html>
